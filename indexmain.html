<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Risk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="stats-bar">
            <div class="stat">
                SCORE:<br>
                <span id="scoreDisplay" class="highlight">200</span>
            </div>
            <div class="stat status-effects" id="statusDisplay">READY</div>
            <div class="stat">
                SPINS:<br>
                <span id="spinCountDisplay" style="color: var(--accent-gold); font-weight: 900; font-size: 1.8rem;">0</span>
            </div>
        </header>

        <main class="wheel-section">
            <div class="wheel-container">
                <div class="wheel-pointer">V</div>
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
            </div>
            <div class="action-buttons">
                <button id="spinBtn" class="primary-btn">SPIN</button>
                <button id="restartBtn" class="primary-btn" style="display: none;">RESTART</button>
            </div>
            <p id="actionLog" class="log-text">REACH 1000 POINTS</p>
        </main>

        <aside class="shop-section">
            <h2>SHOP</h2>
            <div class="shop-items">
                <button class="shop-btn" data-action="buyShield" data-cost="50">
                    SHIELD (50)<br><small>BLOCK LOSS</small>
                </button>
                <button class="shop-btn" data-action="buyCleanse" data-cost="25">
                    CLEANSE (25)<br><small>CLEAR DEBUFFS</small>
                </button>
                <button class="shop-btn" data-action="addEntry100" data-cost="100" id="add100btn">
                    +100 (100)<br><small>POWERFUL GAIN</small>
                </button>
                <button class="shop-btn" data-action="addEntry50" data-cost="50" id="add50btn">
                    +50 (50)<br><small>ADD SLICE</small>
                </button>
                <button class="shop-btn" data-action="buyMultiplier" data-cost="150">
                    MULT (150)<br><small>2X FOR 3</small>
                </button>
                <button class="shop-btn" data-action="deleteNegative" data-cost="75">
                    DELETE (75)<br><small>REMOVE BAD</small>
                </button>
            </div>
        </aside>
    </div>

    <script src="game.js"></script>
</body>
</html>
