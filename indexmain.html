<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎡 Wheel of Risk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="stats-bar">
            <div class="stat">🎯 Score: <span id="scoreDisplay" class="highlight">200</span></div>
            <div class="stat">🎰 Spins: <span id="spinCountDisplay" style="color: var(--accent-yellow); font-weight: 900;">0</span></div>
            <div class="stat status-effects" id="statusDisplay">Ready to spin!</div>
        </header>

        <main class="wheel-section">
            <div class="wheel-container">
                <div class="wheel-pointer">🎯</div>
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
            </div>
            <div class="action-buttons">
                <button id="spinBtn" class="primary-btn">🎡 SPIN! (10 pts)</button>
                <button id="restartBtn" class="primary-btn" style="display: none;">🔄 RESTART</button>
            </div>
            <p id="actionLog" class="log-text">✨ Welcome! Reach 1000 points to win! ✨</p>
        </main>

        <aside class="shop-section">
            <h2>🛍️ The Shop</h2>
            <div class="shop-items">
                <button class="shop-btn" data-action="buyShield" data-cost="50">
                    🛡️ Buy Shield (50 pts)<br><small>Blocks next point decrease</small>
                </button>
                <button class="shop-btn" data-action="buyCleanse" data-cost="25">
                    ✨ Cleanse (25 pts)<br><small>Remove all bad effects</small>
                </button>
                <button class="shop-btn" data-action="addEntry100" data-cost="100" id="add100btn">
                    💯 Add +100 (100 pts)<br><small>Adds a powerful +100 slice</small>
                </button>
                <button class="shop-btn" data-action="addEntry50" data-cost="50" id="add50btn">
                    ⭐ Add +50 (50 pts)<br><small>Adds a +50 slice</small>
                </button>
                <button class="shop-btn" data-action="buyMultiplier" data-cost="150">
                    🚀 Multiplier x2 (150 pts)<br><small>Double points for 3 spins</small>
                </button>
                <button class="shop-btn" data-action="deleteNegative" data-cost="75">
                    🗑️ Remove Bad (75 pts)<br><small>Deletes a negative slice</small>
                </button>
            </div>
        </aside>
    </div>

    <script src="game.js"></script>
</body>
</html>
